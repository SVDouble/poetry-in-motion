name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sym:
    name: Symbolic derivation (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
        working-directory: sym
      - run: uv run ruff format --check . && uv run ruff check . && uv run mypy src
        working-directory: sym
      - run: uv run pytest -q
        working-directory: sym

  core:
    name: Physics core (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release --target wasm32-unknown-unknown -p motion-core
      - uses: actions/upload-artifact@v5
        with:
          name: wasm
          path: target/wasm32-unknown-unknown/release/motion_core.wasm

  web:
    name: Web app (TypeScript)
    needs: core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@v6
        with:
          name: wasm
          path: web/src/wasm
      - run: npm ci
      - run: npx biome ci .
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx vite build
      - uses: astral-sh/setup-uv@v7
      - run: uv run --with playwright python -m playwright install --with-deps chromium
      # The core job supplied the WASM artifact; the smoke target only needs to serve it.
      - run: make -C .. -o wasm e2e-smoke
