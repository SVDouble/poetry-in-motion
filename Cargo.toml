[workspace]
resolver = "3"
members = ["core"]

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
many_single_char_names = "allow"  # textbook notation: M, C, N, q, p ...
similar_names = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
suboptimal_flops = "allow"        # mul_add everywhere hurts readability of the physics
doc_markdown = "allow"            # docs are full of math (θ_d, τ_ext) that is not code
needless_range_loop = "allow"     # index loops over several parallel arrays read best in physics code
missing_const_for_fn = "allow"    # cascades through setters; const-ness is not part of this API

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
